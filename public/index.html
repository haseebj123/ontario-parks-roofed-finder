<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f5f7">
<title>Roofed Accommodation Finder</title>
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header id="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none"
           stroke="currentColor" stroke-width="2.1"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/>
        <path d="M10 19.5v-5h4v5"/>
      </svg>
    </span>
    <h1>Roofed Accommodation<span class="dim"> · Ontario Parks</span></h1>
  </div>
  <div class="spacer"></div>
  <div id="scanmeta">loading…</div>
  <button id="rescan">Refresh</button>
</header>

<div id="layout">

  <aside id="sidebar">
    <div class="scroller">

      <section class="group">
        <h2>Stay</h2>
        <div class="duo">
          <div class="fcell">
            <label for="f-nights">Nights</label>
            <input type="number" id="f-nights" value="2" min="1" max="14">
          </div>
          <div class="fcell">
            <label for="f-capacity">Sleeps</label>
            <input type="number" id="f-capacity" placeholder="Any" min="1" max="12">
          </div>
        </div>
      </section>

      <section class="group">
        <h2>Arrive on</h2>
        <div class="seg" id="f-arrive" role="radiogroup" aria-label="Arrival day">
          <input type="radio" name="arrive" id="ar-any" value="any" checked>
          <label for="ar-any">Any day</label>
          <input type="radio" name="arrive" id="ar-weekend" value="weekend">
          <label for="ar-weekend">Weekend</label>
          <input type="radio" name="arrive" id="ar-fri" value="fri">
          <label for="ar-fri">Friday</label>
          <input type="radio" name="arrive" id="ar-sat" value="sat">
          <label for="ar-sat">Saturday</label>
        </div>
        <p class="foot">Weekend means arriving Friday or Saturday.</p>
      </section>

      <section class="group">
        <h2>Arrival window</h2>
        <div class="duo">
          <div class="fcell">
            <label for="f-start">Earliest</label>
            <input type="date" id="f-start">
          </div>
          <div class="fcell">
            <label for="f-end">Latest</label>
            <input type="date" id="f-end">
          </div>
        </div>
      </section>

      <section class="group">
        <h2>Type</h2>
        <div class="chips" id="f-types">
          <label><input type="checkbox" value="cabin" checked><span>Rustic Cabin</span></label>
          <label><input type="checkbox" value="yurt" checked><span>Yurt / Shelter</span></label>
          <label><input type="checkbox" value="cottage" checked><span>Cottage</span></label>
          <label><input type="checkbox" value="trailer" checked><span>Trailer</span></label>
        </div>
      </section>

      <section class="group">
        <h2>Options</h2>
        <div class="card">
          <div class="field switchrow">
            <label for="f-loose">Include partial nights</label>
            <span class="switch">
              <input type="checkbox" id="f-loose"><i></i>
            </span>
          </div>
        </div>
        <div class="searchbox">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <path d="M7 1a6 6 0 1 0 3.7 10.7l3.3 3.3 1.1-1.1-3.3-3.3A6 6 0 0 0 7 1zm0 1.5A4.5 4.5 0 1 1 7 11.5 4.5 4.5 0 0 1 7 2.5z"/>
          </svg>
          <input type="search" id="f-park" placeholder="Search parks">
        </div>
      </section>

    </div>

    <div id="summary"></div>
    <div id="results"></div>
  </aside>

  <main id="mapwrap">
    <div id="map"></div>
    <div id="legend">
      <strong>Matching stays</strong>
      <span><i class="dot d0"></i> None</span>
      <span><i class="dot d1"></i> 1–9</span>
      <span><i class="dot d2"></i> 10–49</span>
      <span><i class="dot d3"></i> 50 or more</span>
    </div>
  </main>

</div>

<div id="detail" class="hidden">
  <div id="detail-inner">
    <div class="sheetbar">
      <button id="detail-close" aria-label="Close">Done</button>
    </div>
    <div id="detail-body"></div>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
